<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>온바탕 — 그림 그리기</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="./brand/app-icon.svg?v=b1">
  <link rel="stylesheet" href="../src/editor.css?v=0.64.0" />
  <link rel="stylesheet" href="./app.css?v=0.64.0" />
  <link rel="stylesheet" href="./brand.css?v=0.64.0" />
  <link rel="preload" href="./brand/noto-sans-kr.woff2" as="font" type="font/woff2" crossorigin />
  <!-- 들여쓰기: 다른 앱이 iframe 으로 부르는 온바탕(embed.js 가 부른다). 첫 화면 없이 바로 꾸미는 화면을 연다. 꾸미는 화면이 열릴 때까지 여는 화면으로 덮는다. -->
  <style>
    body{margin:0}
    .embed-wait{position:fixed;inset:0;z-index:5000;display:grid;place-content:center;justify-items:center;gap:12px;background:#f5f5ef;color:#24322d;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:1rem}
    .embed-wait i{width:34px;height:34px;border-radius:50%;border:4px solid #d7e6df;border-top-color:#286f62;animation:embed-spin 1s linear infinite}
    @keyframes embed-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.embed-wait i{animation:none}}
    .embed-ready .embed-wait{display:none}
    body:not(.embed-ready) #app{visibility:hidden}
    .embed-alone .embed-wait i{display:none}
  </style>
</head>
<body class="mc-app">
  <div class="embed-wait" role="status" aria-live="polite"><i aria-hidden="true"></i><span class="embed-wait-text">온바탕을 여는 중이에요</span></div>
  <main id="app"></main>
  <script type="module">
    import './embed-host.js';
    // 혼자 열린 경우(다른 앱이 부르지 않음): 쓰는 법을 알린다.
    if (document.body.classList.contains('embed-alone')) document.querySelector('.embed-wait-text').textContent = '이 화면은 다른 앱이 온바탕을 불러 쓸 때 열려요. 온바탕은 onbatang.web.app/app/ 에서 쓰세요.';
  </script>
</body>
</html>
