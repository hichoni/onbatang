<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>온바탕 · HTML 모션 에셋</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#101823;color:#f1f5ee;font-family:system-ui,"Malgun Gothic",sans-serif}
  main{max-width:920px;margin:auto;padding:clamp(24px,5vw,64px) 20px}
  header{border-top:2px solid #9de0cc;padding-top:20px}
  small{font-size:.77rem;letter-spacing:.1em;font-weight:750;color:#9de0cc}
  h1{font-size:clamp(2.1rem,6vw,3.7rem);line-height:1.12;letter-spacing:-.06em;margin:16px 0}
  p{line-height:1.65;color:#c6d2d6;margin:0}
  section{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin:12px 0 26px}
  h2{font-size:1.05rem;margin:28px 0 4px} .settings{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
  label{display:grid;gap:4px;color:#bfd8d3;font-size:.82rem} input,select{min-height:44px;max-width:100%;color:#f5f7f5;background:#20303c;border:1px solid #57717b;border-radius:8px;padding:6px 10px;font:inherit}
  button{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:0 16px 16px;border:1px solid #354756;border-radius:16px;overflow:hidden;background:#1b2835;color:inherit;text-align:start;cursor:pointer;font:inherit}
  button:hover,button:focus-visible{outline:2px solid #93dcc9;outline-offset:2px}
  .art{display:block;grid-column:1/-1;margin:0 -16px 12px;height:134px;background:radial-gradient(ellipse at 60% 90%,#26354d,#101a29 90%)}
  #scenes .art,#questions .art{height:auto;aspect-ratio:2/1}
  #questions em{color:#101f2b;background:#a0e9d1;padding:5px 9px;border-radius:7px}
  b{font-size:1.15rem} em{grid-row:2;grid-column:2;font-style:normal;color:#9de0cc;font-size:.78rem;align-self:center}
  .hint{grid-column:1/-1;color:#c4d3d9;font-size:.88rem}
  footer{border-top:1px solid #384854;padding-top:16px;color:#b7c9c8;font-size:.85rem;line-height:1.6}
</style>
<main>
  <header><small>온바탕 / 움직임</small><h1>HTML 모션 에셋</h1><p>작은 창 속에 보이는 그림은 무엇일까요? 카드를 눌러 단서를 하나씩 열어 보세요.</p></header>
  <h2>질문하고 단계별 공개</h2><section id="questions" aria-label="질문하고 단계별 공개"></section>
  <div class="settings">
    <label>시연할 제목<input id="title" value="작은 픽셀이 모여 그림이 된다" maxlength="72"></label>
    <label>시연할 차트<select id="chart"><option value="pixels">도안별 픽셀 수 · 세로</option><option value="change">모둠별 증감 · 가로</option></select></label>
    <label>재생 속도<select id="pace"><option value="">보통</option><option value="slow">여유롭게</option><option value="fast">빠르게</option></select></label>
    <label>효과 색감<select id="palette"><option value="">기본 색감</option><option value="lagoon">민트 · 바다</option><option value="sunset">노을 · 산호</option><option value="iris">보라 · 오로라</option></select></label>
  </div>
  <h2>수업 내용 강조</h2><section id="scenes" aria-label="수업 내용 강조"></section>
  <h2>시선을 끄는 효과</h2><section id="accents" aria-label="시선을 끄는 효과"></section>
  <footer>편집기에서 조각 선택 → 움직임 → HTML 그래픽 효과. 재생 시점을 정하고, 필요하면 함께 보여 줄 설명을 적으세요.</footer>
</main>
<script type="module">
  import { EFFECT_ASSETS, previewEffect } from '../src/effect-assets.js';
  const title=document.querySelector('#title'), chart=document.querySelector('#chart'), pace=document.querySelector('#pace'), palette=document.querySelector('#palette');
  const changes={t:'chart',kind:'hbar',title:'모둠별 픽셀 변화',unit:'칸',labels:['파랑','노랑','초록'],
    series:[{name:'첫 도안',values:[-3,0,7]},{name:'바꾼 도안',values:[2,4,9]}]};
  const posters=[];
  for (const asset of EFFECT_ASSETS) {
    const button=document.createElement('button');
    button.type='button';
    const art=document.createElement('span'), name=document.createElement('b');
    const hint=document.createElement('span'), play=document.createElement('em');
    button.dataset.asset=asset.id;
    art.className='art';
    let step=0;
    const render=animate=>{
      previewEffect(art,asset.id,animate,{pace:pace.value,palette:palette.value,step,
        content:asset.id==='kinetic'?{t:'text',text:title.value}:asset.id==='bars'&&chart.value==='change'?changes:asset.example});
      play.textContent=asset.last?(step===asset.last(asset.example)?'처음부터':asset.next(step,asset.example)):'▶ 재생';
    };
    render(false); posters.push(()=>render(false));
    name.textContent=asset.name; hint.className='hint'; hint.textContent=asset.hint;
    button.append(art,name,play,hint);
    button.onclick=() => {if(asset.last)step=(step+1)%(asset.last(asset.example)+1);render(true);};
    document.querySelector(asset.last?'#questions':asset.example?'#scenes':'#accents').append(button);
  }
  title.oninput=chart.onchange=pace.onchange=palette.onchange=()=>posters.forEach(draw=>draw());
</script>
</html>
